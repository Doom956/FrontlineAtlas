# Fly.io alternative to render.yaml (uses the Dockerfile). Change `app` to a free name, then: fly deploy --ha=false
# Keep ONE machine: lobbies and games live in the server's memory. Details: docs/MULTIPLAYER.md.
app = "borderfall-change-me"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_START_SECONDS = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
