# Multiplayer end-to-end checks (tests/e2e/mp-pillars and mp-arsenal) on GitHub's runners, one clean machine per
# test and map seed. Started by pushing a snapshot to an e2e/<label> branch (scripts/remote-e2e.sh). The seeds to try
# are in .e2e/seeds (one line, space separated; 0 = a random map). Without FIXED_SEED mp-pillars uses map seed 13 and
# mp-arsenal seed 12: maps where both scripted players get iron, oil and coast (both passed on 2026-11-03).
# Never runs on main or dev.
name: Multiplayer e2e

on:
  push:
    branches: ['e2e/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.p.outputs.seeds }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "seeds=$(node -e "const s=require('fs').readFileSync('.e2e/seeds','utf8').trim().split(/\s+/).filter(Boolean);console.log(JSON.stringify(s.length?s:['0']))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        test: [mp-pillars, mp-arsenal]
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g playwright@1.63.0 && playwright install --with-deps chromium
      - run: npm run build
      - name: ${{ matrix.test }} on seed ${{ matrix.seed }}
        env:
          FIXED_SEED: ${{ matrix.seed }}
        run: |
          if [ "$FIXED_SEED" = default ]; then unset FIXED_SEED; fi
          node tests/e2e/${{ matrix.test }}.e2e.mjs 2>&1 | tee e2e.log
          exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.test }}-${{ matrix.seed }}
          path: e2e.log
          retention-days: 3
